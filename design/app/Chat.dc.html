<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lumi · Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECEEF1;text-decoration:none}a:hover{color:#FFFFFF}
button,input{font:inherit}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes chipIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes morph{from{transform:scale(.6) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.msgIn{animation:msgIn .26s cubic-bezier(.2,.8,.2,1) both}
.dot{animation:dot 1.1s ease-in-out infinite}
.caret{display:inline-block;width:7px;height:16px;margin-left:2px;vertical-align:-2px;border-radius:1px;background:#B5F23D;animation:blink .8s steps(1) infinite}
.hop{animation:hop .9s ease-in-out infinite}
.chipIn{animation:chipIn .4s cubic-bezier(.2,.8,.2,1) both}
.morph{animation:morph .22s cubic-bezier(.3,1.3,.5,1) both}
.press{transition:transform .12s ease,background-color .2s}
.press:active{transform:scale(.94)}
.list::-webkit-scrollbar{display:none}
.compose{transition:border-color .2s}
.compose:focus-within{border-color:#3A4150}
@media (prefers-reduced-motion: reduce){.msgIn,.dot,.caret,.hop,.chipIn,.morph{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1014; color: #ECEEF1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid #1F232B">
<a href="History.dc.html" aria-label="Riwayat percakapan" class="press" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px">Rencana liburan ke Jogja</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9BA3AF"><span style="width: 6px; height: 6px; border-radius: 50%; background: #B5F23D"></span>Sisa <span style="font-family: 'JetBrains Mono', monospace; color: #ECEEF1">{{ quota }}</span> pesan hari ini</span>
</div>
<a href="Settings.dc.html" aria-label="Pengaturan" class="press" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #2A2F38; color: #ECEEF1; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">R</span>
</a>
</header>

<main class="list" ref="{{ listRef }}" style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none">
<div style="align-self: center; font-size: 12px; color: #9BA3AF; padding: 4px 10px; border-radius: 10px; background: #13161B">Hari ini · 08.12</div>
<sc-for list="{{ msgs }}" as="m" hint-placeholder-count="3">
<sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ true }}">
<div class="msgIn" style="align-self: flex-end; max-width: 80%; background: #1F232B; border-radius: 20px 20px 6px 20px; padding: 11px 15px; font-size: 15px; line-height: 1.45">{{ m.text }}</div>
</sc-if>
<sc-if value="{{ m.isBot }}" hint-placeholder-val="{{ false }}">
<div class="msgIn" style="display: flex; gap: 10px; align-items: flex-start; max-width: 92%">
<div class="{{ m.avatarClass }}" style="width: 30px; height: 30px; flex-shrink: 0">
<svg viewBox="0 0 120 120" width="30" height="30" aria-hidden="true"><rect width="120" height="120" rx="30" fill="#B5F23D"></rect><svg x="2" y="8" width="116" height="116" viewBox="62 36 116 116"><g stroke-linecap="round" stroke-linejoin="round" stroke="#14161A" stroke-width="4"><ellipse cx="120" cy="172" rx="52" ry="46" fill="#F2A65A"></ellipse><path d="M80 82 L86 44 L110 66 Z" fill="#F2A65A"></path><path d="M160 82 L154 44 L130 66 Z" fill="#F2A65A"></path><ellipse cx="120" cy="106" rx="50" ry="42" fill="#F2A65A"></ellipse><path d="M110 68 L112 80 M120 66 V80 M130 68 L128 80" fill="none"></path><ellipse cx="102" cy="106" rx="5" ry="7" fill="#14161A"></ellipse><ellipse cx="138" cy="106" rx="5" ry="7" fill="#14161A"></ellipse><path d="M116 116 L124 116 L120 121 Z" fill="#E07A6A"></path><path d="M120 121 Q115 128 109 124 M120 121 Q125 128 131 124" fill="none"></path></g></svg></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-top: 4px">
<sc-if value="{{ m.typing }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 5px; padding: 8px 2px" aria-label="Lumi sedang mengetik">
<span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #9BA3AF"></span>
<span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #9BA3AF; animation-delay: .15s"></span>
<span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #9BA3AF; animation-delay: .3s"></span>
</div>
</sc-if>
<p style="margin: 0; font-size: 15px; line-height: 1.55; white-space: pre-wrap">{{ m.text }}<sc-if value="{{ m.streaming }}" hint-placeholder-val="{{ false }}"><span class="caret"></span></sc-if></p>
<sc-if value="{{ m.stopped }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; color: #F5B544">Dihentikan</span>
</sc-if>
</div>
</div>
</sc-if>
</sc-for>
</main>

<sc-if value="{{ showChips }}" hint-placeholder-val="{{ true }}">
<div style="flex-shrink: 0; display: flex; gap: 8px; padding: 0 16px 10px; overflow: hidden">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{ c.pick }}" class="press chipIn" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 20px; background: #171A20; border: 1px solid #2A2F38; color: #ECEEF1; font-size: 13px; animation-delay: {{ c.delay }}">{{ c.label }}</button>
</sc-for>
</div>
</sc-if>

<div style="flex-shrink: 0; padding: 4px 12px 24px">
<div class="compose" style="display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 16px; background: #171A20; border: 1px solid #2A2F38; border-radius: 26px">
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pesan untuk Lumi</label>
<input id="msg" type="text" placeholder="Tanya apa saja ke Lumi…" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" style="flex: 1; min-width: 0; height: 44px; background: transparent; border: 0; outline: none; color: #ECEEF1; font-size: 15px">
<sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Hentikan jawaban" onClick="{{ stop }}" class="press morph" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: #ECEEF1; color: #0E1014; display: flex; align-items: center; justify-content: center">
<span style="width: 14px; height: 14px; border-radius: 3px; background: #0E1014"></span>
</button>
</sc-if>
<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Kirim" onClick="{{ send }}" class="press morph" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: {{ sendBg }}; color: #0E1014; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.replies = [
'Boleh! Untuk 3 hari di Jogja, coba begini:\n\nHari 1: Malioboro dan Keraton, malamnya angkringan di Tugu.\nHari 2: sunrise di Punthuk Setumbu lalu Borobudur.\nHari 3: pantai di Gunungkidul, pulang sore.\n\nMau aku hitungkan kira-kira biayanya?',
'Siap. Kira-kira per orang: penginapan Rp250–400 ribu per malam, makan Rp100 ribu per hari, sewa motor Rp75 ribu per hari. Total 3 hari sekitar Rp1,5–2 juta di luar tiket.',
'Catat ya: bawa jaket tipis untuk sunrise, sandal untuk pantai, dan uang tunai kecil untuk parkir. Ada lagi yang mau disiapkan?'
];
this.state = {
draft: '',
quota: 37,
replyIndex: 1,
msgs: [
{ id: 1, role: 'user', text: 'bikinin itinerary 3 hari ke Jogja dong, budget santai' },
{ id: 2, role: 'bot', text: this.replies[0] }
],
busy: false
};
}
componentDidUpdate() {
if (this.list) this.list.scrollTop = this.list.scrollHeight;
}
componentWillUnmount() {
clearInterval(this.iv);
clearTimeout(this.t);
}
patchLast(patch) {
const msgs = this.state.msgs.slice();
msgs[msgs.length - 1] = Object.assign({}, msgs[msgs.length - 1], patch);
this.setState({ msgs });
}
sendText(text) {
if (!text.trim() || this.state.busy) return;
const id = Date.now();
const full = this.replies[this.state.replyIndex % this.replies.length];
this.setState({
draft: '',
busy: true,
quota: Math.max(0, this.state.quota - 1),
replyIndex: this.state.replyIndex + 1,
msgs: this.state.msgs.concat([
{ id, role: 'user', text },
{ id: id + 1, role: 'bot', text: '', typing: true }
])
});
this.t = setTimeout(() => {
this.patchLast({ typing: false, streaming: true });
let i = 0;
this.iv = setInterval(() => {
i = Math.min(full.length, i + 3);
if (i >= full.length) {
clearInterval(this.iv);
this.patchLast({ text: full, streaming: false });
this.setState({ busy: false });
} else {
this.patchLast({ text: full.slice(0, i) });
}
}, 28);
}, 900);
}
renderVals() {
const s = this.state;
const labels = ['Hitung biayanya', 'Barang yang perlu dibawa', 'Ganti ke 2 hari'];
return {
quota: s.quota,
draft: s.draft,
busy: s.busy,
idle: !s.busy,
sendBg: s.draft.trim() ? '#B5F23D' : '#3A4150',
showChips: !s.busy,
listRef: (el) => { this.list = el; },
msgs: s.msgs.map((m) => ({
text: m.text,
isUser: m.role === 'user',
isBot: m.role === 'bot',
typing: !!m.typing,
streaming: !!m.streaming,
stopped: !!m.stopped,
avatarClass: (m.typing || m.streaming) ? 'hop' : ''
})),
chips: labels.map((label, i) => ({ label, delay: (i * 0.06) + 's', pick: () => this.sendText(label) })),
onDraft: (e) => this.setState({ draft: e.target.value }),
onKey: (e) => { if (e.key === 'Enter') this.sendText(s.draft); },
send: () => this.sendText(s.draft),
stop: () => {
clearTimeout(this.t);
clearInterval(this.iv);
this.patchLast({ typing: false, streaming: false, stopped: true });
this.setState({ busy: false });
}
};
}
}
</script>
</body>
</html>
