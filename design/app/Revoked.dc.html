<style>
body{margin:0}
a{color:#ECEEF1;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes dim{from{opacity:0}to{opacity:1}}
@keyframes dialog{0%{opacity:0;transform:scale(.88) translateY(12px)}70%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes z{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(18px,-34px) scale(1.1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,0.98)}}
@keyframes flicker{0%,100%{fill:#3A4150}50%{fill:#556072}}
.dim{animation:dim .3s ease both}
.dialog{animation:dialog .42s .1s cubic-bezier(.2,.8,.2,1) both}
.z{animation:z 2.4s ease-out infinite}
.breathe{transform-origin:120px 220px;animation:breathe 3s ease-in-out infinite}
.flicker{animation:flicker 3s ease-in-out infinite}
.press{transition:transform .12s ease}
.press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.dim,.dialog,.z,.breathe,.flicker{animation:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["Sesi berakhir","Kuota habis"],"default":"Sesi berakhir"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const quota = (this.props.variant ?? 'Sesi berakhir') === 'Kuota habis';
return {
sleepy: !quota,
quota,
lampFill: quota ? '#3A4150' : '#3A4150',
lampClass: quota ? 'flicker' : '',
catLabel: quota ? 'Lumi tidur, lenteranya meredup' : 'Lumi tertidur'
};
}
}
</script>
