<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECEEF1;text-decoration:none}a:hover{color:#FFFFFF}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1014; color: #ECEEF1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 8px 24px 36px; overflow: hidden">

<a href="Login.dc.html" aria-label="Kembali ke halaman masuk" style="width: 44px; height: 44px; margin: 8px 0 0 -12px; display: flex; align-items: center; justify-content: center; border-radius: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>

<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15">Buat akun</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #9BA3AF">Cukup sekali. Setelah itu buka Juru pakai sidik jari.</p>
</div>

<form style="margin-top: 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="reg-name" style="font-size: 13px; font-weight: 500; color: #9BA3AF">Nama panggilan</label>
<input id="reg-name" type="text" autocomplete="nickname" placeholder="Biar Juru tahu manggil kamu apa" style="height: 52px; box-sizing: border-box; padding: 0 16px; background: #171A20; border: 1px solid #2A2F38; border-radius: 14px; color: #ECEEF1; font-size: 15px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="reg-email" style="font-size: 13px; font-weight: 500; color: #9BA3AF">Email</label>
<input id="reg-email" type="email" autocomplete="email" placeholder="kamu@email.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; background: #171A20; border: 1px solid #2A2F38; border-radius: 14px; color: #ECEEF1; font-size: 15px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="reg-pass" style="font-size: 13px; font-weight: 500; color: #9BA3AF">Password</label>
<div style="display: flex; align-items: center; height: 52px; box-sizing: border-box; padding: 0 4px 0 16px; background: #171A20; border: 1px solid #2A2F38; border-radius: 14px">
<input id="reg-pass" type="password" autocomplete="new-password" value="rahasia12" aria-describedby="reg-pass-hint" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; color: #ECEEF1; font-size: 15px; outline: none">
<button type="button" aria-label="Tampilkan password" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #9BA3AF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px">
<span style="height: 4px; border-radius: 2px; background: #B5F23D"></span>
<span style="height: 4px; border-radius: 2px; background: #B5F23D"></span>
<span style="height: 4px; border-radius: 2px; background: #2A2F38"></span>
</div>
<span id="reg-pass-hint" style="font-size: 12px; color: #9BA3AF">Cukup kuat · minimal 8 karakter</span>
</div>

<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px; cursor: pointer">
<input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #B5F23D">
<span>Aktifkan buka dengan sidik jari / Face ID</span>
</label>

<a href="Main.dc.html" style="height: 52px; border-radius: 14px; background: #B5F23D; color: #0E1014; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Buat akun</a>
</form>

<p style="margin: 16px 0 0; text-align: center; font-size: 12px; line-height: 1.5; color: #9BA3AF">Riwayat chat dan memori tetap tersimpan di perangkatmu.</p>

<div style="flex: 1"></div>

<p style="margin: 0; text-align: center; font-size: 14px; color: #9BA3AF">Sudah punya akun? <a href="Login.dc.html" style="font-weight: 600; color: #B5F23D">Masuk</a></p>

</div>
