<style>
body{margin:0}
@keyframes cat-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes cat-wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-16deg)}75%{transform:rotate(10deg)}}
@keyframes cat-swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.cat-bob{animation:cat-bob 3s ease-in-out infinite}
.cat-wave{transform-origin:160px 158px;animation:cat-wave 1.6s ease-in-out infinite}
.cat-swing{transform-origin:42px 140px;animation:cat-swing 2.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.cat-bob,.cat-wave,.cat-swing{animation:none}}
</style>
</helmet>

<header style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #B5F23D; letter-spacing: 0.06em">KARAKTER 1</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 600">Kucing berlentera</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #9BA3AF">Kucing oranye kampung yang menenteng lentera kertas di ekornya. Santai, akrab, dan selalu ada di dekatmu. Lentera hijaunya jadi warna khas Lumi.</p>
</header>

<svg width="300" height="300" viewBox="0 0 240 240" role="img" aria-label="Karakter Lumi: kucing oranye bergaya stiker yang melambai, dengan lentera kertas hijau limau tergantung di ekornya">
<g class="cat-bob" stroke-linecap="round" stroke-linejoin="round">

</g>

</g>
<use href="#cat-body" stroke="#14161A" stroke-width="3.5"></use>

<section aria-label="Dengan logotipe" style="display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.05em">lumi</span>
<span style="font-size: 14px; color: #9BA3AF">Light up your day.</span>
