<style>
body{margin:0}
@keyframes kid-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes kid-wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-18deg)}75%{transform:rotate(10deg)}}
@keyframes kid-steam{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
.kid-bob{animation:kid-bob 3.2s ease-in-out infinite}
.kid-wave{transform-origin:160px 172px;animation:kid-wave 1.6s ease-in-out infinite}
.kid-steam{animation:kid-steam 2.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.kid-bob,.kid-wave,.kid-steam{animation:none}}
</style>
</helmet>
<div style="width: 640px; height: 880px; box-sizing: border-box; padding: 36px; background: #0E1014; color: #ECEEF1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">

<section aria-label="Dengan logotipe" style="display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.05em">lumi</span>
<span style="font-size: 14px; color: #9BA3AF">Light up your day.</span>
