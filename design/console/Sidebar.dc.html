<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","users","providers","logs","settings"],"default":"dashboard"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'dashboard';
const item = (key) => active === key
? { bg: '#1E2A12', color: '#B5F23D', aria: 'page' }
: { bg: 'transparent', color: '#C9CED6', aria: undefined };
return {
dash: item('dashboard'),
users: item('users'),
providers: item('providers'),
logs: item('logs'),
settings: item('settings'),
};
}
}
</script>
